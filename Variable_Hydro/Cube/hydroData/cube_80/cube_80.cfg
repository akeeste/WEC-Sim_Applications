! Variable hydrodynamics - bottom-louvered cube at 80 degrees open
 ipltdat=0    (0, do not output files for panel / patch discretization)
 ISOR=0       (0, dont use source formulation (used for fluid/pressure/mean drift calcs). 1 increases expense ^^^)
 ISOLVE=1     (2, use block solver. 0, iterative solver (don't use with IRR). 1, direct solver. >=2 iterative w/ n blocks)
 INUMOPT5=1   (1, separate radiation and diff components in output)
 ILOWHI=0     (0, low order method; 1, high order method)
 ISCATT=0     (0, solve for total diffraction potential, not scattering)
 ILOG=1       (1, use ILOG in POT file, integrate log singularity)
 IRR=0        (0, no IRR in POT file, irregular-frequency removal)
 MONITR=0     (0, do not write FORCE output data to monitor)
 NUMHDR=1     (1, write headers to numeric output files)
 IPERIN=2     (2, use frequency (rad/s) input for PER)
 INUMOPT5=1   (1, separate radiation and diff components of pressure/velocity in output)
 IALTFRC=2    (2, use frc file format that allows rho)
 MAXITT=50    (increase number of maximum iterations in solver from 35 (default))
 IDELFILES=4  (4, automatically overwrite old .p2f, .out and delete new .p2f when done
 NPDIPOLE(1)=(1 304) (all patches on body 1 are dipoles)
 IQUADO=3     (default option for the b-spline)
 IQUADI=4     (default option for the b-spline)
 KSPLIN=3     (default option for the b-spline)
